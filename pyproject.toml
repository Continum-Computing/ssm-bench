[project]
name = "ssm-bench"
version = "0.1.0"
description = "Reproducible benchmarks for state-space, attention and hybrid sequence models on GPUs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "Angufibo Lincoln", email = "angufibolinc@gmail.com"}
]
keywords = ["ssm", "mamba", "transformer", "benchmark", "gpu", "state-space-model"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "pytest>=7.0.0",
]

[project.optional-dependencies]
dev = [
    # Pinned exactly, not to a band. Ruff retunes existing rules and adds new
    # ones in patch releases, so a range lets CI and a contributor resolve
    # different versions and disagree about whether the same code is clean.
    # Bump this deliberately, then fix whatever the new version reports.
    # .github/workflows/ci.yml installs the same version and must be updated
    # with it.
    "ruff==0.17.0",
    "pytest-cov>=4.0.0",
]
profiling = [
    "pynvml>=11.0.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["model*", "profiling*", "configs*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
    # A, B, C, D and the discretized A_bar, B_bar are the state-space matrices
    # from the SSM literature. The reference implementations keep that spelling
    # so they can be read line by line against the papers they implement.
    # Lowercasing them would make the code harder to check, not tidier.
    "N803",  # argument name should be lowercase
    "N806",  # variable in function should be lowercase
]

[tool.ruff.lint.isort]
known-first-party = ["model", "profiling", "configs"]

[tool.pytest.ini_options]
testpaths = ["model/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
